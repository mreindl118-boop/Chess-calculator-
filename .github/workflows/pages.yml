name: Publish app to GitHub Pages

# Publishes the built app to the gh-pages branch, which GitHub Pages serves
# at https://mreindl118-boop.github.io/Chess-calculator-/
# (The actions/deploy-pages route is not used: creating the Pages site via
# the workflow token is not permitted; branch-based Pages auto-enables.)
on:
  push:
    branches: [main, claude/gambitlab-chess-checkers-ms7cjq]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build (subpath base)
        run: BASE_PATH=/${{ github.event.repository.name }}/ npm run build

      - name: Push site to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish site from ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
