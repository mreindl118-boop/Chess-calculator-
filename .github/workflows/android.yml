name: Build Android APK

# Builds a sideloadable debug APK on GitHub's runners (which have the Android
# SDK) and publishes it to the `android-latest` release, giving a stable
# download link. The APK is a thin Capacitor shell that loads the live site
# (server.url), so it always runs the latest deployed app.

on:
  workflow_dispatch: {}
  push:
    branches: [claude/gambitlab-chess-checkers-ms7cjq]
    paths:
      - '.github/workflows/android.yml'
      - 'android/**'
      - 'capacitor.config.ts'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # the deployed site the shell loads
      GAMBITLAB_URL: https://mreindl118-boop.github.io/Chess-calculator-/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # web build + copy the Capacitor config/assets into the android project
      - run: npm run build
      - run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Stage APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/gambitlab-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gambitlab-debug-apk
          path: out/gambitlab-debug.apk

      - name: Publish to the android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: GambitLab Android (debug APK)
          body: |
            Sideloadable debug build of GambitLab for Android.

            - Loads the live app: ${{ env.GAMBITLAB_URL }}
            - Needs internet on first launch, then works offline (PWA cache).
            - Install: enable "Install unknown apps" for your browser/file
              manager, then open the APK. It is a debug build (not Play-signed).

            Rebuilt automatically from commit ${{ github.sha }}.
          files: out/gambitlab-debug.apk
          make_latest: false
